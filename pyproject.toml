[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain-community<0.4.2",
    "langchain-core>=1.4.3",
    "langchain-google-vertexai>=3.2.4",
    "langchain-openai>=1.3.0",
    "langgraph>=1.2.4",
    "motor>=3.7.1",
    "openai>=1.0",
    "pandas>=2.0",
    "pydantic-settings>=2.14.1",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "ragas>=0.2",
    "rapidfuzz>=3.14.5",
    "sentence-transformers>=5.6.0",
    "uvicorn[standard]>=0.49.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0,<5.0.0",
    "python-multipart>=0.0.6",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "tiktoken>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.uv]
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]