services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    # env_file (no ${VAR} de Compose): así no importa cómo se llame el
    # archivo ni depende de que exista un ".env" literal en el proyecto —
    # POSTGRES_PASSWORD llega directo del archivo a Postgres.
    env_file: .env.production
    environment:
      POSTGRES_USER: ampara
      POSTGRES_DB: ampara
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ampara -d ampara"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env.production
    environment:
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - rag_shared

volumes:
  postgres_data:

networks:
  # Sin external: true — el que arranque primero (este repo o model-service)
  # crea la red con este nombre fijo; el otro la reutiliza automáticamente.
  # Ya no hace falta `docker network create rag_shared` a mano.
  rag_shared:
    name: rag_shared
