services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ampara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ampara
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ampara -d ampara"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "80:8000"
    env_file: .env
    environment:
      # Sobreescribe POSTGRES_DSN del .env para apuntar al contenedor "db"
      POSTGRES_DSN: postgresql://ampara:${POSTGRES_PASSWORD}@db:5432/ampara
      APP_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
